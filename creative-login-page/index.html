<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Login Page</title>
    <!-- Use Poppins font as specified in the code snippet -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for the Blooming Navbar icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- 1. The Blooming Navbar (Implemented from the code snippet in the image) -->
    <div class="navbar-container">
        <nav class="navbar">
            <input type="checkbox" id="toggle">
            <label for="toggle" class="center-btn">
                <i class="fas fa-plus"></i>
            </label>
            <ul class="nav-items">
                <li style="--i:1;"><a href="#"><i class="fas fa-home"></i><span class="tooltip">About</span></a></li>
                <li style="--i:2;"><a href="#"><i class="fas fa-user"></i><span class="tooltip">Services</span></a></li>
                <li style="--i:3;"><a href="#"><i class="fas fa-code"></i><span class="tooltip">Work</span></a></li>
                <li style="--i:4;"><a href="#"><i class="fas fa-envelope"></i><span class="tooltip">Contact</span></a></li>
            </ul>
        </nav>
    </div>

    <!-- 2. The Creative Login Page (Implemented from the visual design in the image) -->
    <div class="login-container">
        <div class="login-card">
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to continue</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                
                <button type="submit" class="login-btn">Log in</button>
                
                <div class="form-footer">
                    <a href="#" class="forgot-pwd">Forgot password?</a>
                    <a href="#" class="sign-up">Sign up</a>
                </div>
            </form>
            
            <!-- Custom SVG Character Illustration (The little boy) -->
            <div class="character">
                <svg id="boy" width="120" height="140" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                  <g transform="translate(10, 20)">
                     <!-- Bucket -->
                     <rect x="60" y="60" width="18" height="22" rx="2" fill="#555" />
                     <path d="M 60 60 Q 69 45 78 60" fill="none" stroke="#777" stroke-width="2" />
                     
                     <!-- Body -->
                     <rect x="25" y="40" width="25" height="35" rx="6" fill="#fff" />
                     <rect x="25" y="65" width="25" height="12" rx="3" fill="#2d3436" /> <!-- Shorts -->
                     
                     <!-- Legs -->
                     <rect x="28" y="70" width="7" height="22" rx="3" fill="#fcd3b6" />
                     <rect x="40" y="70" width="7" height="22" rx="3" fill="#fcd3b6" />
                     
                     <!-- Shoes -->
                     <rect x="26" y="88" width="12" height="6" rx="2" fill="#d63031" />
                     <rect x="38" y="88" width="12" height="6" rx="2" fill="#d63031" />

                     <!-- Left Arm (Animated to cover eyes) -->
                     <path id="left-arm" d="M 30 45 L 18 65" stroke="#fcd3b6" stroke-width="6" stroke-linecap="round" fill="none" style="transition: all 0.3s ease;" />
                     
                     <!-- Head -->
                     <circle cx="37" cy="22" r="18" fill="#fcd3b6" />
                     
                     <!-- Hair -->
                     <path d="M 17 22 Q 37 -8 57 22 Q 47 8 37 8 Q 27 8 17 22 Z" fill="#2d3436" />
                     
                     <!-- Eyes & Face -->
                     <g id="eyes" style="transition: opacity 0.2s;">
                        <circle cx="30" cy="20" r="2.5" fill="#222" />
                        <circle cx="45" cy="20" r="2.5" fill="#222" />
                        <!-- Smile -->
                        <path d="M 35 28 Q 37 32 40 28" fill="none" stroke="#e17055" stroke-width="1.5" stroke-linecap="round" /> 
                     </g>
                     
                     <!-- Right Arm holding bucket -->
                     <path d="M 45 45 L 69 55" stroke="#fcd3b6" stroke-width="6" stroke-linecap="round" fill="none" />
                  </g>
                </svg>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
