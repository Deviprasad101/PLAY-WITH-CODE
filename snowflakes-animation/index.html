<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowflakes Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container for the animated falling snow -->
    <div id="snow-container"></div>
    
    <!-- UI Controls utilizing the provided CSS snippet -->
    <div class="controls">
        <button class="snowflake" id="moreSnow">More Snow ❄️</button>
        <button class="snowflake" id="lessSnow">Less Snow ❄️</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
