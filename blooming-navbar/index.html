<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blooming Navbar</title>
    <!-- Poppins font requested in the CSS snippet -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for the icons used in the snippet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <input type="checkbox" id="toggle" />
        <label for="toggle" class="center-btn">
            <i class="fas fa-plus"></i>
        </label>
        <ul class="nav-items">
            <!-- Exact HTML structure and inline styles from snippet -->
            <li style="--i:1;"><a href="#"><i class="fas fa-user"></i><span>About</span></a></li>
            <li style="--i:2;"><a href="#"><i class="fas fa-code"></i><span>Services</span></a></li>
            <li style="--i:3;"><a href="#"><i class="fas fa-briefcase"></i><span>Work</span></a></li>
            <li style="--i:4;"><a href="#"><i class="fas fa-envelope"></i><span>Contact</span></a></li>
        </ul>
    </nav>
</body>
</html>
