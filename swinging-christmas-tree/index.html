<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swing Christmas Tree</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1st child -->
    <div class="title">Swing Christmas Tree</div>
    
    <!-- 2nd child (matches body ul:nth-child(2) in the snippet) -->
    <ul class="tree">
        <!-- JS will populate the branches -->
    </ul>
    
    <!-- 3rd child -->
    <div class="star">
        <!-- A beautifully glowing SVG star -->
        <svg viewBox="0 0 24 24" fill="#f1c40f" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
    </div>

    <script src="script.js"></script>
</body>
</html>
