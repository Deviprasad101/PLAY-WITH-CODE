<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letter Animation</title>
  <link rel="stylesheet" href="style.css">
  <!-- Adding a cursive font for the letter -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <!-- jQuery just like in the screenshot's code -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="envelope-wrapper">
      <div id="envelope" class="close">
        <div class="front flap"></div>
        <div class="front pocket"></div>
        <div class="letter">
          <div class="words line1">To: Crush</div>
          <div class="words line2">Hope you are smiling</div>
          <div class="words line3">today.</div>
          <div class="words line4">❤️</div>
        </div>
      </div>
    </div>
    
    <div class="reset">
      <button id="open">OPEN</button>
      <button id="reset">CLOSE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
