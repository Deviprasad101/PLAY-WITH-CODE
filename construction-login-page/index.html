<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Site Login</title>
    <!-- Poppins font used in the snippet -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The exact snippet provided for the Blooming Navbar -->
    <!-- Positioned in the corner to complement the main scene -->
    <nav class="navbar" style="position: absolute; top: 30px; left: 30px; z-index: 100;">
        <input type="checkbox" id="toggle" />
        <label for="toggle" class="center-btn">
            <i class="fas fa-bars"></i>
        </label>
        <ul class="nav-items">
            <li style="--i:1;"><a href="#"><i class="fas fa-home"></i><span>About</span></a></li>
            <li style="--i:2;"><a href="#"><i class="fas fa-hard-hat"></i><span>Services</span></a></li>
            <li style="--i:3;"><a href="#"><i class="fas fa-hammer"></i><span>Work</span></a></li>
            <li style="--i:4;"><a href="#"><i class="fas fa-envelope"></i><span>Contact</span></a></li>
        </ul>
    </nav>

    <!-- The Construction Site 3D UI -->
    <div class="scene">
        <!-- Background SVG -->
        <svg class="scene-bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
            <!-- Sky -->
            <rect width="1200" height="800" fill="#87CEEB" />
            
            <!-- Sun -->
            <circle cx="1000" cy="150" r="50" fill="#FFD700" filter="drop-shadow(0 0 15px #FFD700)" />
            
            <!-- Clouds -->
            <g class="clouds">
                <g transform="translate(150, 100) scale(1.5)" fill="#fff" opacity="0.9">
                    <circle cx="40" cy="40" r="20" />
                    <circle cx="70" cy="30" r="25" />
                    <circle cx="100" cy="40" r="20" />
                    <rect x="40" y="40" width="60" height="20" />
                </g>
                <g transform="translate(750, 150) scale(1.2)" fill="#fff" opacity="0.8">
                    <circle cx="40" cy="40" r="20" />
                    <circle cx="70" cy="30" r="25" />
                    <circle cx="100" cy="40" r="20" />
                    <rect x="40" y="40" width="60" height="20" />
                </g>
            </g>

            <!-- Background Buildings -->
            <defs>
                <pattern id="win-bg1" width="30" height="40" patternUnits="userSpaceOnUse">
                    <rect width="30" height="40" fill="#7f8c8d" />
                    <rect x="5" y="5" width="20" height="30" fill="#95a5a6" />
                </pattern>
                <pattern id="win-bg2" width="25" height="35" patternUnits="userSpaceOnUse">
                    <rect width="25" height="35" fill="#636e72" />
                    <rect x="5" y="5" width="15" height="25" fill="#7f8c8d" />
                </pattern>
            </defs>
            <rect x="80" y="250" width="150" height="350" fill="url(#win-bg1)" stroke="#555" stroke-width="2"/>
            <rect x="250" y="200" width="120" height="400" fill="url(#win-bg2)" opacity="0.8" stroke="#444" stroke-width="2"/>
            <rect x="450" y="300" width="160" height="300" fill="url(#win-bg1)" opacity="0.9" stroke="#555" stroke-width="2"/>
            <rect x="800" y="250" width="140" height="350" fill="url(#win-bg2)" stroke="#444" stroke-width="2"/>
            <rect x="1000" y="180" width="130" height="420" fill="url(#win-bg1)" opacity="0.8" stroke="#555" stroke-width="2"/>

            <!-- Construction Cranes -->
            <g fill="#f1c40f" stroke="#333" stroke-width="2">
                <!-- Left Crane -->
                <rect x="350" y="120" width="25" height="480" /> <!-- Tower -->
                <rect x="230" y="120" width="250" height="15" /> <!-- Jib/Arm -->
                <polygon points="350,120 375,120 362.5,70" /> <!-- Top Point -->
                
                <!-- Right Crane -->
                <rect x="750" y="150" width="25" height="450" /> <!-- Tower -->
                <rect x="640" y="150" width="220" height="15" /> <!-- Jib/Arm -->
                <polygon points="750,150 775,150 762.5,100" /> <!-- Top Point -->
            </g>

            <!-- Hoist Cables -->
            <line x1="460" y1="135" x2="460" y2="400" stroke="#2d3436" stroke-width="4" />
            <line x1="740" y1="165" x2="740" y2="400" stroke="#2d3436" stroke-width="4" />
            
            <!-- Hooks attached to board -->
            <circle cx="460" cy="400" r="6" fill="#333" />
            <circle cx="740" cy="400" r="6" fill="#333" />

            <!-- Ground Dirt -->
            <rect y="600" width="1200" height="200" fill="#a06840" />
            <rect y="600" width="1200" height="15" fill="#8b5a2b" />
            
            <!-- Traffic Cones -->
            <g fill="#e67e22">
                <polygon points="150,600 160,570 170,600" />
                <rect x="145" y="595" width="30" height="5" />
                
                <polygon points="350,600 360,570 370,600" />
                <rect x="345" y="595" width="30" height="5" />
                
                <polygon points="850,600 860,570 870,600" />
                <rect x="845" y="595" width="30" height="5" />
                
                <polygon points="1050,600 1060,570 1070,600" />
                <rect x="1045" y="595" width="30" height="5" />
            </g>
            
            <!-- Tractor / Excavator -->
            <g transform="translate(180, 560)">
                <rect x="10" y="20" width="45" height="20" fill="#f1c40f" rx="3"/>
                <rect x="15" y="5" width="20" height="15" fill="#333" />
                <circle cx="20" cy="40" r="10" fill="#222" />
                <circle cx="45" cy="40" r="10" fill="#222" />
                <path d="M 55,30 L 75,10 L 85,35" fill="none" stroke="#f1c40f" stroke-width="5" stroke-linejoin="round"/>
                <path d="M 80,35 L 95,35 L 95,48 L 80,42 Z" fill="#333" />
            </g>
        </svg>

        <!-- The Suspended Login Board -->
        <div class="login-board-container">
            <div class="login-board">
                <h2>SITE ACCESS</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" placeholder="USERNAME" required>
                    </div>
                    <div class="input-group">
                        <input type="password" placeholder="PASSWORD" required>
                    </div>
                    <button type="button" class="login-btn">LOGIN</button>
                    <a href="#" class="forgot">Forgot Password?</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
