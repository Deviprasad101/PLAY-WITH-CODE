<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Lamp Login</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  
  <div class="container">
    
    <!-- Left Side: Cute Animated Lamp -->
    <div class="lamp-section" id="lampSection">
      <svg class="lamp" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        
        <!-- Light Beam (Appears when ON) -->
        <path class="light-beam" d="M50,160 L-100,450 L300,450 L150,160 Z" fill="url(#beamGrad)" />
        
        <defs>
          <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(255, 234, 0, 0.4)"/>
            <stop offset="100%" stop-color="rgba(255, 234, 0, 0)"/>
          </linearGradient>
        </defs>

        <!-- Lamp Base & Stem -->
        <ellipse cx="100" cy="280" rx="45" ry="10" fill="#2a2a2a"/>
        <rect x="94" y="150" width="12" height="130" fill="#3a3a3a"/>
        
        <!-- Interactive Cord -->
        <g class="cord-group" id="cordGroup">
          <path class="cord" d="M70,160 L60,240" stroke-width="3" stroke-linecap="round"/>
          <circle class="knob" cx="60" cy="240" r="6" fill="#555"/>
        </g>
        
        <!-- Lamp Bulb Area -->
        <ellipse class="shade-inside" cx="100" cy="160" rx="45" ry="10" fill="#1a1a1a"/>
        
        <!-- Lamp Shade (The cute character face) -->
        <path d="M55,160 L75,60 Q100,55 125,60 L145,160 Z" fill="#2c2c34"/>
        
        <!-- Character Eyes -->
        <!-- 1. Closed Eyes (Default) -->
        <g id="eyes-closed" class="eyes">
          <path d="M72,120 Q80,128 88,120" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
          <path d="M112,120 Q120,128 128,120" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
        </g>
        
        <!-- 2. Open Eyes (When typing username or light is on) -->
        <g id="eyes-open" class="eyes" style="opacity: 0;">
          <circle cx="80" cy="120" r="4.5" fill="#111"/>
          <circle cx="120" cy="120" r="4.5" fill="#111"/>
        </g>
        
        <!-- 3. Squint/Covered Eyes (When typing password) -->
        <g id="eyes-squint" class="eyes" style="opacity: 0;">
          <path d="M72,125 L88,115 M72,115 L88,125" stroke="#111" stroke-width="3" stroke-linecap="round"/>
          <path d="M112,125 L128,115 M112,115 L128,125" stroke="#111" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Cheek blushes -->
        <circle cx="68" cy="128" r="5" fill="#ff7777" style="opacity: 0.3;"/>
        <circle cx="132" cy="128" r="5" fill="#ff7777" style="opacity: 0.3;"/>

        <!-- Tongue sticking out (When light turns on!) -->
        <path class="lamp__tongue" id="tongue" d="M92,130 Q100,145 108,130 Z" style="opacity: 0;"/>
      </svg>
    </div>
    
    <!-- Right Side: Login Form -->
    <div class="form-section">
      <div class="login-box">
        <h2>Login</h2>
        <p>Sign in to your account</p>
        
        <form id="loginForm">
          <div class="input-group">
            <i class="far fa-user"></i>
            <input type="text" id="username" placeholder="Username" autocomplete="off" required>
          </div>
          
          <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password" autocomplete="off" required>
          </div>
          
          <button type="submit" class="login-btn">Sign In</button>
          
          <div class="form-footer">
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>
        </form>
      </div>
    </div>
    
  </div>

  <script src="script.js"></script>
</body>
</html>
