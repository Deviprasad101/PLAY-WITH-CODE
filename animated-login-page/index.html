<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube to Login - Bounce Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Elements -->
    <div class="horizon"></div>
    <div class="glow-bottom"></div>

    <!-- Left Side: 3D Animated Cube -->
    <div class="cube-scene">
        <div class="shadow"></div>
        <div class="cube-wrapper">
            <div class="cube">
                <div class="face front"><i class="fab fa-instagram"></i></div>
                <div class="face back"><i class="fab fa-instagram"></i></div>
                <div class="face right"><i class="fab fa-instagram"></i></div>
                <div class="face left"><i class="fab fa-instagram"></i></div>
                <div class="face top"><i class="fab fa-instagram"></i></div>
                <div class="face bottom"><i class="fab fa-instagram"></i></div>
            </div>
        </div>
    </div>

    <!-- Right Side: Glassmorphism Login Form -->
    <div class="form-wrapper">
        <div class="login-box">
            <h2>Welcome Back</h2>
            <p>Please login to your account</p>
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" required autocomplete="off">
                    <label>Username</label>
                </div>
                <div class="input-group">
                    <input type="password" required autocomplete="off">
                    <label>Password</label>
                </div>
                <div class="options">
                    <label class="remember"><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
